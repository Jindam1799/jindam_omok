<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>진담오목 - 진심을 담은 진담중국어</title>

    <!-- 안드로이드 크롬 강제 실행 스크립트 -->
    <script>
      (function () {
        var userAgent = navigator.userAgent.toLowerCase();
        if (userAgent.match(/android/i)) {
          if (
            userAgent.match(/kakaotalk|naver|instagram|fb_iab|fbav|line|daum/i)
          ) {
            var targetUrl = location.href.replace(/^https?:\/\//i, '');
            var chromeIntent =
              'intent://' +
              targetUrl +
              '#Intent;scheme=https;package=com.android.chrome;end;';
            location.href = chromeIntent;
          }
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+KR:wght@700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. 스플래시 화면 -->
    <div id="splash-screen" onclick="showLobby()">
      <div class="splash-title">진심을담은</div>
      <div class="splash-main">진담중국어</div>
      <div class="splash-blink">화면을 터치해주세요</div>
    </div>

    <!-- 2. 로비 화면 -->
    <div id="lobby-screen">
      <div class="lobby-title">진담오목</div>

      <select id="lesson-select" class="lesson-select">
        <option value="1,2">1과 ~ 2과</option>
        <option value="3,4">3과 ~ 4과</option>
        <option value="5,6">5과 ~ 6과</option>
        <option value="7,8">7과 ~ 8과</option>
        <option value="9,10">9과 ~ 10과</option>
        <option value="11,12">11과 ~ 12과</option>
        <option value="13,14">13과 ~ 14과</option>
        <option value="15,16">15과 ~ 16과</option>
        <option value="17,18">17과 ~ 18과</option>
        <option value="19,20">19과 ~ 20과</option>
        <option value="21,22">21과 ~ 22과</option>
        <option value="23,24">23과 ~ 24과</option>
        <option value="25,26">25과 ~ 26과</option>
        <option value="27,28">27과 ~ 28과</option>
        <option value="29,30">29과 ~ 30과</option>
      </select>

      <button class="mode-btn peace" onclick="prepareGame()">
        게임시작하기
      </button>
    </div>

    <!-- 3. 규칙 설명 모달 -->
    <div id="rule-modal-overlay">
      <div id="rule-modal-content">
        <h2>📜 진담오목 규칙</h2>
        <div class="rule-text">
          <p>1. 바둑판을 터치하면 중국어 듣기 문제가 나옵니다.</p>
          <p>2. 들려주는 질문에 알맞은 대답을 고르세요.</p>
          <p>3. <strong>정답</strong>을 맞히면 내 돌이 놓입니다.</p>
          <p>4. <strong>오답</strong>을 고르면 방어용 회색 돌이 놓입니다.</p>
          <p>5. 내 돌 5개를 먼저 연결하면 승리합니다!</p>
        </div>
        <button
          class="mode-btn peace"
          style="width: 100%"
          onclick="startGame()"
        >
          확인 및 게임 시작
        </button>
      </div>
    </div>

    <!-- 4. 게임 화면 -->
    <div id="game-screen">
      <div id="status">흑(Black) 차례입니다</div>
      <div id="mode-indicator"></div>

      <!-- 컨트롤 패널 -->
      <div class="game-controls">
        <button class="game-btn" onclick="returnToLobbyFromGame()">
          🏠 로비로
        </button>
        <button class="game-btn" id="undo-btn" onclick="undoMove()">
          ↩️ 무르기(2)
        </button>
        <button class="game-btn" onclick="restartGame()">🔄 다시하기</button>
      </div>

      <div id="board-container">
        <div id="board"></div>

        <div id="board-toast">
          <div id="toast-cn" class="toast-cn"></div>
          <div id="toast-kr" class="toast-kr"></div>
          <div id="toast-answer" class="toast-answer"></div>
        </div>
      </div>
    </div>

    <!-- 5. 퀴즈 모달 -->
    <div id="quiz-modal-overlay">
      <div id="quiz-modal-content">
        <div id="modal-title"></div>

        <div class="question-container">
          <div id="modal-question-cn"></div>
          <div id="modal-question-kr" style="display: none"></div>
        </div>

        <div class="controls-container">
          <button class="action-btn" onclick="replayQuestionTTS()">
            🔊 질문 다시 듣기
          </button>
          <button class="action-btn" onclick="toggleTranslation()">
            👀 해석 보기
          </button>
        </div>

        <div id="choices-container"></div>
      </div>
    </div>

    <!-- 6. 게임 종료 복습 모달 -->
    <div id="review-modal-overlay">
      <div id="review-modal-content">
        <h2>📜 복습 및 오답 노트</h2>
        <div id="review-list"></div>
        <button
          class="mode-btn peace"
          style="margin-top: 20px; width: 100%"
          onclick="returnToLobby()"
        >
          로비로 돌아가기
        </button>
      </div>
    </div>

    <!-- 💡 7. 모바일 터치 오류 방지용 커스텀 시스템 팝업창 -->
    <div id="sys-modal-overlay">
      <div id="sys-modal-content">
        <h3
          id="sys-modal-msg"
          style="color: #333; margin-top: 0; font-size: 18px; line-height: 1.4"
        ></h3>
        <div style="display: flex; gap: 10px; margin-top: 20px">
          <button
            class="mode-btn peace"
            id="sys-btn-confirm"
            style="margin: 0; flex: 1; font-size: 16px"
            onclick="onSysConfirmClick()"
          >
            확인
          </button>
          <button
            class="mode-btn"
            id="sys-btn-cancel"
            style="
              margin: 0;
              flex: 1;
              font-size: 16px;
              background-color: #888;
              box-shadow: none;
            "
            onclick="onSysCancelClick()"
          >
            취소
          </button>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
